  <style>
    /* Force all elements to be visible when a crawler is detected */
    .bot-crawler * {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
      visibility: visible !important;
    }
  </style>
  <script>
    if (/bot|googlebot|crawler|spider|robot|crawling|google-inspectiontool/i.test(navigator.userAgent)) {
      document.documentElement.classList.add('bot-crawler');
    }
  </script>
